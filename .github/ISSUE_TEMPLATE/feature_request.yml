name: "✨ Feature Request"
description: "Suggest a new feature for gvu"
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: "Problem"
      description: "What problem does this feature solve?"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "Proposed solution"
      description: "How do you envision this working?"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives considered (optional)"
      description: "Have you thought of other approaches?"
